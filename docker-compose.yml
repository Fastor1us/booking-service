name: booking-service

services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-network]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
        # Внешний listener для подключения с хоста (например, из dotnet run локально).
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два listener'а: INTERNAL — для сервисов внутри сети Docker, EXTERNAL — для хоста.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [app-network]

  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16-alpine
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]

  events-db:
    image: postgres:16-alpine
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: eventsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]

  bookings-db:
    image: postgres:16-alpine
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookingsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]

  # ─────────────────────────── Приложения ───────────────────────────
  userservice:
    build:
      context: .
      dockerfile: src/Services/UserService/UserService.Presentation/Dockerfile
    container_name: eventapi-userservice
    depends_on:
      users-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__usersdb: "Host=users-db;Port=5432;Database=usersdb;Username=postgres;Password=postgres"
      ConnectionStrings__DefaultConnection: "Host=users-db;Port=5432;Database=usersdb;Username=postgres;Password=postgres"
      ConnectionStrings__Kafka: "kafka:29092"
      Jwt__SigningKey: "Very_Secure_And_Vey_Long_Secret_JWT_Token"
      Jwt__Issuer: "BookingApi"
      Jwt__Audience: "BookingApi"
      Jwt__ExpiresInMinutes: "60"
    ports:
      - "5001:8080"
    networks: [app-network]

  eventservice:
    build:
      context: .
      dockerfile: src/Services/EventService/EventService.Presentation/Dockerfile
    container_name: eventapi-eventservice
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__eventsdb: "Host=events-db;Port=5432;Database=eventsdb;Username=postgres;Password=postgres"
      ConnectionStrings__DefaultConnection: "Host=events-db;Port=5432;Database=eventsdb;Username=postgres;Password=postgres"
      ConnectionStrings__Kafka: "kafka:29092"
      Jwt__SigningKey: "Very_Secure_And_Vey_Long_Secret_JWT_Token"
      Jwt__Issuer: "BookingApi"
      Jwt__Audience: "BookingApi"
      Jwt__ExpiresInMinutes: "60"
    ports:
      - "5002:8080"
    networks: [app-network]

  bookingservice:
    build:
      context: .
      dockerfile: src/Services/BookingService/BookingService.Presentation/Dockerfile
    container_name: eventapi-bookingservice
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__bookingsdb: "Host=bookings-db;Port=5432;Database=bookingsdb;Username=postgres;Password=postgres"
      ConnectionStrings__DefaultConnection: "Host=bookings-db;Port=5432;Database=bookingsdb;Username=postgres;Password=postgres"
      ConnectionStrings__Kafka: "kafka:29092"
      Jwt__SigningKey: "Very_Secure_And_Vey_Long_Secret_JWT_Token"
      Jwt__Issuer: "BookingApi"
      Jwt__Audience: "BookingApi"
      Jwt__ExpiresInMinutes: "60"
    ports:
      - "5003:8080"
    networks: [app-network]

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:

networks:
  app-network:
    driver: bridge