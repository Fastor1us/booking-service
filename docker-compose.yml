name: booking-service

services:
  # ─────────────────────────── Infrastructure ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-network]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [app-network]
    
  redis:
    image: redis:7-alpine
    container_name: eventapi-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-network]

  # ─────────────────────────── DBs (per service) ───────────────────────────
  users-db:
    image: postgres:16-alpine
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]

  events-db:
    image: postgres:16-alpine
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: eventsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]

  bookings-db:
    image: postgres:16-alpine
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookingsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]

  # ─────────────────────────── Apps ───────────────────────────
  userservice:
    build:
      context: .
      dockerfile: src/Services/UserService/UserService.Presentation/Dockerfile
    container_name: eventapi-userservice
    depends_on:
      users-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__usersdb: "Host=users-db;Port=5432;Database=usersdb;Username=postgres;Password=postgres"
      ConnectionStrings__DefaultConnection: "Host=users-db;Port=5432;Database=usersdb;Username=postgres;Password=postgres"
      ConnectionStrings__Kafka: "kafka:29092"
      Jwt__SigningKey: "Very_Secure_And_Vey_Long_Secret_JWT_Token"
      Jwt__Issuer: "BookingApi"
      Jwt__Audience: "BookingApi"
      Jwt__ExpiresInMinutes: "60"
      Otlp__Endpoint: http://jaeger:4317
    ports:
      - "5001:8080"
    networks: [app-network]

  eventservice:
    build:
      context: .
      dockerfile: src/Services/EventService/EventService.Presentation/Dockerfile
    container_name: eventapi-eventservice
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__eventsdb: "Host=events-db;Port=5432;Database=eventsdb;Username=postgres;Password=postgres"
      ConnectionStrings__DefaultConnection: "Host=events-db;Port=5432;Database=eventsdb;Username=postgres;Password=postgres"
      ConnectionStrings__Kafka: "kafka:29092"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SigningKey: "Very_Secure_And_Vey_Long_Secret_JWT_Token"
      Jwt__Issuer: "BookingApi"
      Jwt__Audience: "BookingApi"
      Jwt__ExpiresInMinutes: "60"
      EventCacheOptions__EventTtl: "00:05:00"
      EventCacheOptions__TopEventsTtl: "00:10:00"
      Otlp__Endpoint: http://jaeger:4317
    ports:
      - "5002:8080"
    networks: [app-network]

  bookingservice:
    build:
      context: .
      dockerfile: src/Services/BookingService/BookingService.Presentation/Dockerfile
    container_name: eventapi-bookingservice
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__bookingsdb: "Host=bookings-db;Port=5432;Database=bookingsdb;Username=postgres;Password=postgres"
      ConnectionStrings__DefaultConnection: "Host=bookings-db;Port=5432;Database=bookingsdb;Username=postgres;Password=postgres"
      ConnectionStrings__Kafka: "kafka:29092"
      Jwt__SigningKey: "Very_Secure_And_Vey_Long_Secret_JWT_Token"
      Jwt__Issuer: "BookingApi"
      Jwt__Audience: "BookingApi"
      Jwt__ExpiresInMinutes: "60"
      Otlp__Endpoint: http://jaeger:4317
    ports:
      - "5003:8080"
    networks: [app-network]

  # ─────────────────────────── Telemetry ───────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eventapi-prometheus
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [app-network]

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: eventapi-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [app-network]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: eventapi-grafana
    depends_on:
      - prometheus
      - jaeger
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [app-network]

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
  grafana-data:

networks:
  app-network:
    driver: bridge